name: Build AimoOS VMware release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/release.yml']
permissions:
  contents: write
concurrency:
  group: aimoos-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Resolve Ubuntu packages
        run: |
          sudo apt-get update
          sudo env AIMO_BUILD_DIR=/tmp/aimoos-build python3 scripts/fetch_runtime.py
      - name: Verify desktop and installation safeguards
        run: |
          sudo install -d -m 700 /tmp/aimo-ci-runtime
          sudo env XDG_RUNTIME_DIR=/tmp/aimo-ci-runtime AIMO_BUILD_DIR=/tmp/aimoos-build QT_QPA_PLATFORM=offscreen bash scripts/native_env.sh /tmp/aimoos-build/sysroot/usr/bin/python3.12 -m unittest discover -s tests -v
      - name: Prepare Linux root and storage initramfs
        run: |
          set -o pipefail
          free -h
          df -h /tmp
          sudo env PYTHONUNBUFFERED=1 AIMO_BUILD_DIR=/tmp/aimoos-build python3 scripts/build_vmware.py --out /tmp/aimoos-release --phase prepare 2>&1 | tee /tmp/aimoos-build.log
      - name: Create bootable ISO and bootstrap disk
        run: |
          set -o pipefail
          sudo env PYTHONUNBUFFERED=1 AIMO_BUILD_DIR=/tmp/aimoos-build python3 scripts/build_vmware.py --out /tmp/aimoos-release --phase iso 2>&1 | tee -a /tmp/aimoos-build.log
      - name: Save filesystem build log
        uses: actions/upload-artifact@v4
        with:
          name: aimoos-filesystem-log
          path: /tmp/aimoos-build.log
      - name: Install ISO onto virtual SATA disk
        run: |
          set -o pipefail
          sudo env PYTHONUNBUFFERED=1 AIMO_BUILD_DIR=/tmp/aimoos-build python3 scripts/build_vmware.py --out /tmp/aimoos-release --phase install 2>&1 | tee -a /tmp/aimoos-build.log
      - name: Package VMware files after temporary disk cleanup
        run: |
          set -o pipefail
          df -h /tmp
          sudo env PYTHONUNBUFFERED=1 AIMO_BUILD_DIR=/tmp/aimoos-build python3 scripts/build_vmware.py --out /tmp/aimoos-release --phase package 2>&1 | tee -a /tmp/aimoos-build.log
          sudo chmod a+r /tmp/aimoos-release/*.iso /tmp/aimoos-release/*.zip /tmp/aimoos-release/SHA256SUMS.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          gh release create "v${version}" "/tmp/aimoos-release/AimoOS-${version}-amd64.iso" "/tmp/aimoos-release/AimoOS-${version}-VMware.zip" /tmp/aimoos-release/SHA256SUMS.txt docs/VMWARE.md --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "AimoOS ${version} · VMware 预览版" --prerelease --notes-file docs/RELEASE_0.2.0.md
      - name: Save build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: aimoos-build-log
          path: |
            /tmp/aimoos-build.log
            /tmp/aimoos-release/build-boot.log
