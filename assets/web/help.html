<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>使用说明</title><style>body{background:#f2ede4;color:#1d1b18;max-width:700px;margin:60px auto;padding:28px;font:16px/1.9 sans-serif}h1{font:36px Georgia,'Noto Serif CJK SC',serif}a{color:#95654f}</style><h1>使用说明</h1><p>从居中的开始菜单打开应用。窗口顶部可以拖动，边缘可以调整大小。</p><p>Alt + Tab 切换窗口，Windows 键打开开始菜单，Windows + 左右方向键分屏，Windows + L 锁定屏幕。</p><p>在文件中浏览个人目录。记事本可以打开与保存文本；关闭未保存的文档会先询问。终端运行真实 Linux 命令。</p><p>在设置中切换明暗主题、文字大小和减少动态效果。文件、账户和偏好会在重新启动后保留。</p><a href="/">返回首页</a>
